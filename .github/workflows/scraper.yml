name: Daily Taiwan Stock Scraper

on:
  schedule:
    # 台灣時間(UTC+8)下午 15:30 = UTC 07:30 (週一至週五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 允許手動觸發測試

# 確保 Action 具有寫入 Repository 的權限
permissions:
  contents: write

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 取得程式碼
        uses: actions/checkout@v4
        with:
          ref: main         # 明確指定抓取 main 分支
          fetch-depth: 0    # 抓取完整歷史紀錄

      - name: ⚙️ 設定 Go 環境
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🚀 執行爬蟲程式
        working-directory: ./finish
        run: |
          go mod init quant-data || true
          go mod tidy
          go run Stock_TOP10.go

      - name: 將產生的 CSV 存回 GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 強制切換並確保我們在 main 分支上操作
          git checkout main
          git add .
          
          # 判斷是否有檔案變更，有變更才 commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 自動更新: 台股每日 TOP10 潛力股資料 [skip ci]"
            
            echo "=== 開始同步並推播 ==="
            # 🌟 關鍵終極修正：加入 5 次 Retry 機制，徹底消滅 Git 推播衝突
            for i in {1..5}; do
              echo "嘗試推播 (第 $i 次)..."
              
              # 拉取遠端最新進度並疊加
              git fetch origin main
              git pull --rebase origin main
              
              # 嘗試推播
              if git push origin main; then
                echo "✅ 推播成功！"
                exit 0
              fi
              
              echo "⚠️ 推播遇到衝突，等待 10 秒後自動重試..."
              sleep 10
            done
            
            echo "❌ 重試 5 次皆失敗，請檢查 Git 設定。"
            exit 1
          else
            echo "✅ 沒有新資料需要更新"
            exit 0
          fi
