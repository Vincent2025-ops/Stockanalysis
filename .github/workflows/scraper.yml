name: Daily Taiwan Stock Scraper

on:
  schedule:
    # 台灣時間(UTC+8)下午 15:30 = UTC 07:30 (週一至週五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 允許手動觸發測試

# 確保 Action 具有寫入 Repository 的權限
permissions:
  contents: write

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 取得程式碼
        uses: actions/checkout@v4
        with:
          ref: main         # 🌟 關鍵修正 1：明確指定抓取 main 分支
          fetch-depth: 0    # 🌟 關鍵修正 2：抓取完整歷史紀錄

      - name: ⚙️ 設定 Go 環境
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 🚀 執行爬蟲程式
        # ⚠️ 修正點 1：直接進入 finish 資料夾即可
        working-directory: ./finish
        run: |
          go mod init quant-data || true
          go mod tidy
          go run Stock_TOP10.go

      - name: 將產生的 CSV 存回 GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 🌟 關鍵修正 3：強制切換並確保我們在 main 分支上操作
          git checkout main
          
          git add .
          
          # 判斷是否有檔案變更，有變更才 commit，避免回傳錯誤碼導致中斷
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 自動更新: 台股每日 TOP10 潛力股資料 [skip ci]"
          else
            echo "沒有新資料需要更新"
            exit 0
          fi
          
          # 🌟 關鍵修正 4：強制拉取遠端最新進度並合併
          echo "=== 抓取遠端最新狀態 ==="
          git fetch origin main
          git pull --rebase origin main
          
          echo "=== 推播回 GitHub ==="
          git push origin main
